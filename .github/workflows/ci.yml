name: DataOps CI - DBT Build & Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  dbt-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dbt-duckdb prefect dlt

      - name: Run DLT Ingestion to generate database
        env:
          DESTINATION__DUCKDB__CREDENTIALS__DATABASE: "velos_meteo_pipeline.duckdb"
        run: python dlt_pipeline/ingestion.py

      - name: Run dbt test and build
        env:
          DUCKDB_PATH: "velos_meteo_pipeline.duckdb"
        run: dbt build --project-dir dbt_transform --profiles-dir dbt_transform