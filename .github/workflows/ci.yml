name: DataOps CI - DBT Build & Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  dbt-ci:
    runs-on: ubuntu-latest
    env:
      DUCKDB_PATH: ${{ github.workspace }}/velos_meteo_pipeline.duckdb

    steps:
      # ... inchangé jusqu'à l'ingestion

      - name: Run DLT Ingestion to generate database
        run: |
          python dlt_pipeline/ingestion.py
          ls -la ${{ github.workspace }}/*.duckdb

      - name: Run dbt test and build
        run: dbt build --project-dir dbt_transform --profiles-dir dbt_transform